<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лимит тяжек</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B0D12">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Лимит">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,600;1,700&family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Тёмный спортивный стиль: два кольца активности (тяжки снаружи, упражнение внутри), крупные цифры, градиентные кнопки. */
:root{
  --bg:#0B0D12; --card:#151922; --card2:#1D222D; --ink:#F4F6FA; --muted:#8A93A6; --line:rgba(255,255,255,.08);
  --puff-a:#FFB020; --puff-b:#FF5A1F;
  --move-a:#19E3C5; --move-b:#3DA9FF;
  --bad:#FF4D5E; --good:#B6F23A;
  --display:'Barlow Condensed','Onest',system-ui,sans-serif;
  --body:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-text-size-adjust:100%;
  background-image:radial-gradient(120% 60% at 50% -10%,rgba(255,106,31,.14),transparent 60%),radial-gradient(90% 50% at 100% 30%,rgba(25,227,197,.07),transparent 60%);
  background-attachment:fixed}
.wrap{max-width:480px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 112px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
h2{font-size:22px;font-weight:800;text-wrap:balance;letter-spacing:-.01em}
.muted{color:var(--muted)}
.num,.n{font-family:var(--display);font-style:italic;font-weight:700;font-variant-numeric:tabular-nums}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 2px 0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.head .day{display:flex;flex-direction:column;gap:0}
.head .day .n{font-size:64px;line-height:.9}
.head .right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right}
.head .date{font-size:14px;color:var(--muted);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 11px;border-radius:99px;background:rgba(182,242,58,.12);color:var(--good)}
.pill.off{background:rgba(255,255,255,.07);color:var(--muted)}
.pill svg{width:14px;height:14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero{align-items:center;padding:22px 18px 18px;gap:18px}
.rings{position:relative;width:min(300px,78vw);aspect-ratio:1}
.rings svg{width:100%;height:100%;display:block}
.trk{fill:none;stroke:rgba(255,255,255,.07);stroke-width:16}
.arc{fill:none;stroke-width:16;stroke-linecap:round}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.center .num{font-size:84px;line-height:.85}
.center .of{font-size:15px;color:var(--muted);font-weight:600;margin-top:6px}
.center.over .num{color:var(--bad)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.lg{background:var(--card2);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.lg .eyebrow{display:flex;align-items:center;gap:7px;letter-spacing:.1em;font-size:11px}
.lg i{width:9px;height:9px;border-radius:50%;flex:none}
.lg.p i{background:linear-gradient(135deg,var(--puff-a),var(--puff-b))}
.lg.m i{background:linear-gradient(135deg,var(--move-a),var(--move-b))}
.lg b{font-family:var(--display);font-style:italic;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.lg b small{font-size:18px;color:var(--muted);font-weight:600}
.lg .s{font-size:13px;color:var(--muted);font-weight:500;overflow-wrap:anywhere}
.lg .s.bad{color:var(--bad);font-weight:700}

button{font:inherit;min-height:52px;border-radius:16px;border:0;background:var(--card2);color:var(--ink);font-weight:700;padding:0 16px;cursor:pointer;touch-action:manipulation;transition:transform .08s ease,filter .15s}
button:active{transform:scale(.97);filter:brightness(1.15)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--move-a);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.cta{width:100%;min-height:68px;font-size:20px;font-weight:800;letter-spacing:.01em;color:#1A0D02;background:linear-gradient(135deg,var(--puff-a),var(--puff-b));box-shadow:0 10px 28px -10px rgba(255,90,31,.7)}
.cta.m{color:#021A18;background:linear-gradient(135deg,var(--move-a),var(--move-b));box-shadow:0 10px 28px -10px rgba(25,227,197,.6)}
.btns{display:flex;gap:10px;width:100%}
.btns button{flex:1}
.sec{font-size:17px}
.task{display:flex;align-items:center;justify-content:space-between;gap:12px}
.task h2{font-size:26px}
.task .tag{font-size:12px;font-weight:700;color:var(--move-a);background:rgba(25,227,197,.12);padding:5px 10px;border-radius:99px;white-space:nowrap}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--move-a),var(--move-b))}
.st{font-weight:700;font-size:16px}
.note{font-size:14px;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.stat b{font-family:var(--display);font-style:italic;font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.stat.warn b{color:var(--bad)}
.stat.good b{color:var(--good)}

svg.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:rgba(255,255,255,.08);stroke-width:1}
.chart .tx{fill:var(--muted);font-size:10px;font-family:var(--body)}
.chart .lim{stroke:var(--ink);stroke-width:1.5;fill:none;stroke-dasharray:4 3}
.chart .dot{fill:var(--ink)}
.lgd{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;background:linear-gradient(135deg,var(--puff-a),var(--puff-b));margin-right:6px}
.lgd i.l{background:none;border-top:2px dashed var(--ink);height:0;border-radius:0;width:16px;vertical-align:middle}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;min-height:72px;padding:12px 16px;align-items:center;width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;font-weight:400}
.row .t{font-weight:700}
.row .s{font-size:13px;color:var(--muted);font-weight:500}
.row .r{text-align:right;font-variant-numeric:tabular-nums}
.row .r b{font-family:var(--display);font-style:italic;font-size:24px}
.chips{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:2px}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--muted)}
.chip.good{background:rgba(182,242,58,.13);color:var(--good)}
.chip.bad{background:rgba(255,77,94,.15);color:var(--bad)}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
input,textarea{font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;min-height:50px}
textarea{min-height:120px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.danger{color:var(--bad)}
.danger.arm{background:var(--bad);color:#fff}

.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 55%,transparent)}
.tabs div{display:flex;gap:6px;width:100%;max-width:480px;background:rgba(29,34,45,.92);border:1px solid var(--line);border-radius:22px;padding:6px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tabs button{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;background:none;color:var(--muted);border-radius:16px;padding:0}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{background:rgba(255,255,255,.09);color:var(--ink)}
.tabs button[aria-current="page"] svg{color:var(--puff-a)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{width:100%;max-width:480px;background:var(--card);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
@media (prefers-reduced-motion: reduce){ button{transition:none} button:active{transform:none} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Разделы"><div>
  <button data-act="tab" data-tab="today" id="tab-today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/></svg>Сегодня</button>
  <button data-act="tab" data-tab="history" id="tab-history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>История</button>
  <button data-act="tab" data-tab="settings" id="tab-settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Настройки</button>
</div></nav>
<div id="dlg"></div>

<script>
(function(){
'use strict';
var LS='vape-limit-v1';
function DEF(){return {startDate:null,startLimit:100,step:2,rollHour:4,
  exercises:['Подтягивания','Отжимания','Приседания','Пресс','Бёрпи'],
  puffs:{},done:{},updated:0};}

var S=load(), tab='today', editKey=null, note='', armed=false, sync='local', dbDoc=null, wt=null;

function load(){
  try{var r=localStorage.getItem(LS); if(r){return Object.assign(DEF(),JSON.parse(r));}}catch(e){}
  return DEF();
}
function pad(n){return String(n).padStart(2,'0');}
function todayKey(){
  var d=new Date(Date.now()-S.rollHour*3600000);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function utc(k){var p=k.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2]);}
function addDays(k,n){var t=new Date(utc(k)+n*86400000);return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(t.getUTCDate());}
function dayNum(k){return Math.round((utc(k)-utc(S.startDate))/86400000)+1;}
function limitFor(n){return Math.max(0,S.startLimit-S.step*(n-1));}
function exFor(n){var l=S.exercises;return l.length?l[(((n-1)%l.length)+l.length)%l.length]:'Упражнение';}
function pOf(k){return S.puffs[k]||0;}
function dOf(k){return S.done[k]||0;}
function fmt(k){return new Date(utc(k)).toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fix(){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(S.startDate||''))S.startDate=todayKey();
  if(!Array.isArray(S.exercises)||!S.exercises.length)S.exercises=DEF().exercises;
  ['startLimit','step','rollHour'].forEach(function(f){S[f]=Number(S[f]);if(!isFinite(S[f]))S[f]=DEF()[f];});
  if(!S.puffs||typeof S.puffs!=='object')S.puffs={};
  if(!S.done||typeof S.done!=='object')S.done={};
}
fix();

function save(){
  S.updated=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
  if(dbDoc){clearTimeout(wt);wt=setTimeout(pushDb,800);}
}
function pushDb(){
  if(!dbDoc)return Promise.resolve();
  return Promise.resolve(dbDoc.set({json:JSON.stringify(S),updated:S.updated}))
    .then(function(){sync='ok';}).catch(function(){sync='err';});
}
function initDb(){
  if(!(window.claude&&window.claude.use))return;
  Promise.all([claude.use('db'),claude.use('user')]).then(function(r){
    var db=r[0],user=r[1]; if(!db||!user)return;
    return Promise.resolve(user.id()).then(function(id){
      if(!id)return;
      dbDoc=db.collection('data/users/'+id).doc('state');
      return Promise.resolve(dbDoc.get()).then(function(snap){
        var ex=snap&&(typeof snap.exists==='function'?snap.exists():snap.exists);
        var data=ex?(typeof snap.data==='function'?snap.data():snap.data):null;
        if(!data&&snap&&snap.json)data=snap;
        if(data&&data.json&&(data.updated||0)>S.updated){
          S=Object.assign(DEF(),JSON.parse(data.json));fix();
          try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
          sync='ok';render();
        }else if(S.updated>0&&(!data||S.updated>(data.updated||0))){
          return pushDb().then(render);
        }else{sync='ok';render();}
      });
    });
  }).catch(function(){});
}

function add(o,k,n){o[k]=Math.max(0,(o[k]||0)+n);}
function buzz(){try{if(navigator.vibrate)navigator.vibrate(12);}catch(e){}}
function pct(v,max){if(max<=0)return v>0?100:0;return Math.max(0,Math.min(100,v/max*100));}
function debt(n){var s=0;for(var i=1;i<n;i++){var k=addDays(S.startDate,i-1);s+=Math.max(0,pOf(k)-dOf(k));}return s;}
function streak(n){var c=0;for(var i=n-1;i>=1;i--){var k=addDays(S.startDate,i-1);if(pOf(k)<=limitFor(i))c++;else break;}return c;}

function arc(r,p,grad){
  var C=2*Math.PI*r, len=C*p/100;
  return '<circle class="trk" cx="100" cy="100" r="'+r+'"/>'+
    (p>0?'<circle class="arc" cx="100" cy="100" r="'+r+'" stroke="url(#'+grad+')" stroke-dasharray="'+len.toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 100 100)"/>':'');
}
function rings(pp,dp,over){
  return '<svg viewBox="0 0 200 200" role="img" aria-label="Кольца: тяжки и упражнение"><defs>'+
   '<linearGradient id="gP" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB020"/><stop offset="1" stop-color="#FF5A1F"/></linearGradient>'+
   '<linearGradient id="gB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A6B"/><stop offset="1" stop-color="#FF2E4D"/></linearGradient>'+
   '<linearGradient id="gM" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#19E3C5"/><stop offset="1" stop-color="#3DA9FF"/></linearGradient>'+
   '</defs>'+arc(88,pp,over?'gB':'gP')+arc(66,dp,'gM')+'</svg>';
}

function viewToday(){
  var key=todayKey(), n=dayNum(key);
  if(n<1){
    return '<section class="card"><h2>Старт '+esc(fmt(S.startDate))+'</h2><p class="muted">До начала ещё '+(1-n)+' дн. Дату старта можно поменять в настройках.</p></section>';
  }
  var lim=limitFor(n), p=pOf(key), d=dOf(key), left=lim-p, over=p>lim, rem=p-d, dbt=debt(n), st=streak(n);
  var pSub= over?'<div class="s bad">выше лимита на '+(-left)+'</div>':left===0?'<div class="s">лимит выбран</div>':'<div class="s">осталось '+left+'</div>';
  var dSub= rem>0?'осталось '+rem:rem===0?(p===0?'пока нечего делать':'всё сделано'):'сверх нормы +'+(-rem);
  var h='';
  h+='<div class="head"><div class="day"><span class="eyebrow">День</span><span class="n">'+n+'</span></div>'+
     '<div class="right"><span class="pill'+(st?'':' off')+'"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2s1 4-2 7c-2 2-4 3-4 7a6 6 0 0 0 12 0c0-3-2-5-3-7-1 2-2 3-3 3 1-3 1-7 0-10z"/></svg>Серия '+st+' дн.</span>'+
     '<span class="date">'+esc(fmt(key))+' · завтра '+limitFor(n+1)+'</span></div></div>';
  h+='<section class="card hero"><div class="rings">'+rings(pct(p,lim),pct(d,p),over)+
     '<div class="center'+(over?' over':'')+'"><span class="eyebrow">Тяжки</span><span class="num">'+p+'</span><span class="of">из '+lim+'</span></div></div>'+
     '<div class="legend"><div class="lg p"><span class="eyebrow"><i></i>Тяжки</span><b>'+p+'<small> / '+lim+'</small></b>'+pSub+'</div>'+
     '<div class="lg m"><span class="eyebrow"><i></i>'+esc(exFor(n))+'</span><b>'+d+'<small> / '+p+'</small></b><div class="s">'+dSub+'</div></div></div>'+
     '<button class="cta" data-act="puff" data-n="1">+1 тяжка</button>'+
     '<div class="btns"><button data-act="puff" data-n="5">+5</button><button data-act="puff" data-n="-1" aria-label="Убрать одну тяжку">−1</button></div></section>';
  h+='<section class="card"><div class="task"><div><span class="eyebrow">Упражнение дня</span><h2>'+esc(exFor(n))+'</h2></div><span class="tag">1 тяжка = 1 раз</span></div>'+
     '<div class="bar"><i style="width:'+pct(d,p)+'%"></i></div>'+
     '<div class="st">'+d+' из '+p+' · '+dSub+'</div>'+
     '<button class="cta m" data-act="done" data-n="1">+1 сделал</button>'+
     '<div class="btns"><button data-act="done" data-n="5">+5</button><button data-act="done" data-n="10">+10</button><button data-act="done" data-n="-1" aria-label="Убрать одно повторение">−1</button></div>'+
     '<button data-act="doneall"'+(rem<=0?' disabled':'')+'>Закрыть все '+Math.max(0,rem)+'</button>'+
     (dbt>0?'<p class="note">Долг за прошлые дни: '+dbt+'. Закрыть его можно в истории.</p>':'')+'</section>';
  h+='<div class="stats"><div class="stat good"><span>Серия в лимите</span><b>'+st+' дн.</b></div>'+
     '<div class="stat"><span>Лимит сегодня</span><b>'+lim+'</b></div>'+
     '<div class="stat'+(dbt>0?' warn':'')+'"><span>Долг повторений</span><b>'+dbt+'</b></div></div>';
  return h;
}

function chart(n){
  var from=Math.max(1,n-13), pts=[], i;
  for(i=from;i<=n;i++){pts.push({n:i,p:pOf(addDays(S.startDate,i-1)),l:limitFor(i)});}
  var W=340,H=150,L=30,R=8,T=14,B=22, pw=W-L-R, ph=H-T-B;
  var mx=Math.max(10,Math.ceil(Math.max.apply(null,pts.map(function(q){return Math.max(q.p,q.l);}))/10)*10);
  function y(v){return T+ph-(v/mx)*ph;}
  var slot=pw/pts.length, bw=slot*0.6, s='';
  s+='<defs><linearGradient id="cP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB020"/><stop offset="1" stop-color="#FF5A1F"/></linearGradient></defs>';
  s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(0)+'" y2="'+y(0)+'"/><line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(mx)+'" y2="'+y(mx)+'"/>';
  s+='<text class="tx" x="'+(L-5)+'" y="'+(y(mx)+3)+'" text-anchor="end">'+mx+'</text><text class="tx" x="'+(L-5)+'" y="'+(y(0)+3)+'" text-anchor="end">0</text>';
  var line=[];
  pts.forEach(function(q,j){
    var cx=L+slot*(j+0.5), h=Math.max(0,(q.p/mx)*ph);
    s+='<rect fill="'+(q.p>q.l?'#FF4D5E':'url(#cP)')+'" x="'+(cx-bw/2).toFixed(1)+'" y="'+(y(0)-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3"/>';
    line.push(cx.toFixed(1)+','+y(q.l).toFixed(1));
  });
  s+='<polyline class="lim" points="'+line.join(' ')+'"/>';
  var last=pts[pts.length-1], lx=L+slot*(pts.length-0.5);
  s+='<circle class="dot" cx="'+lx.toFixed(1)+'" cy="'+y(last.l).toFixed(1)+'" r="3.5"/>';
  s+='<text class="tx" x="'+(W-R)+'" y="'+(y(last.l)-7).toFixed(1)+'" text-anchor="end">лимит '+last.l+'</text>';
  s+='<text class="tx" x="'+(L+slot*0.5).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+pts[0].n+'</text>';
  if(pts.length>1)s+='<text class="tx" x="'+lx.toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+last.n+'</text>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Тяжки по дням и лимит">'+s+'</svg>';
}

function viewHistory(){
  var n=dayNum(todayKey());
  if(n<1)return '<section class="card"><h2>История пуста</h2><p class="muted">Старт ещё не наступил.</p></section>';
  var h='<div class="head"><div class="day"><span class="eyebrow">Прогресс</span><h2 style="font-size:32px">История</h2></div></div>'+
    '<section class="card"><span class="eyebrow">Последние 14 дней, номер дня внизу</span>'+chart(n)+
    '<div class="lgd"><span><i></i>тяжки</span><span><i class="l"></i>лимит</span></div></section><div class="rows">';
  for(var i=n;i>=1;i--){
    var k=addDays(S.startDate,i-1), p=pOf(k), d=dOf(k), l=limitFor(i), rem=p-d;
    var c1=p>l?'<span class="chip bad">выше на '+(p-l)+'</span>':'<span class="chip good">в лимите</span>';
    var c2=rem>0?'<span class="chip bad">долг '+rem+'</span>':(p>0?'<span class="chip good">сделано</span>':'');
    h+='<button class="row" data-act="edit" data-k="'+k+'"><span class="t">День '+i+' · '+esc(fmt(k))+'<br><span class="s">'+esc(exFor(i))+' '+d+' из '+p+'</span></span>'+
       '<span class="r"><b>'+p+'</b> / '+l+'<div class="chips">'+c1+c2+'</div></span></button>';
  }
  return h+'</div>';
}

function viewSettings(){
  var st= sync==='ok'?'Данные сохраняются в твоём аккаунте и на этом устройстве.':sync==='err'?'Не удалось сохранить в аккаунт, данные пока только на этом устройстве.':'Данные хранятся на этом устройстве.';
  var h='<div class="head"><div class="day"><span class="eyebrow">Правила игры</span><h2 style="font-size:32px">Настройки</h2></div></div>'+
   '<section class="card"><h2>Лимит</h2>'+
   '<div class="two"><div class="field"><label for="s-limit">Лимит в первый день</label><input id="s-limit" type="number" inputmode="numeric" min="1" max="1000" value="'+S.startLimit+'" data-set="startLimit"></div>'+
   '<div class="field"><label for="s-step">Минус в день</label><input id="s-step" type="number" inputmode="numeric" min="0" max="50" value="'+S.step+'" data-set="step"></div></div>'+
   '<div class="two"><div class="field"><label for="s-date">Дата первого дня</label><input id="s-date" type="date" value="'+S.startDate+'" data-set="startDate"></div>'+
   '<div class="field"><label for="s-roll">Новый день с (час)</label><input id="s-roll" type="number" inputmode="numeric" min="0" max="12" value="'+S.rollHour+'" data-set="rollHour"></div></div>'+
   '<p class="note">До этого часа ночи тяжки пишутся на вчерашний день.</p></section>';
  h+='<section class="card"><h2>Упражнения</h2><div class="field"><label for="s-ex">По одному на строку, меняются по кругу: 1-й день — первая строка</label>'+
   '<textarea id="s-ex" data-set="exercises">'+esc(S.exercises.join('\n'))+'</textarea></div></section>';
  h+='<section class="card"><h2>Данные</h2><p class="note">'+st+'</p>'+
   '<button data-act="copy">Скопировать резервную копию</button>'+
   '<div class="field"><label for="imp">Вставить резервную копию</label><textarea id="imp" placeholder="Вставь сюда скопированный текст"></textarea></div>'+
   '<button data-act="import">Загрузить из копии</button>'+
   (note?'<p class="note" role="status">'+esc(note)+'</p>':'')+
   '<button class="danger'+(armed?' arm':'')+'" data-act="restart">'+(armed?'Точно? Вся история удалится':'Начать заново с сегодняшнего дня')+'</button></section>';
  return h;
}

function dialog(){
  if(!editKey)return '';
  var k=editKey, n=dayNum(k);
  return '<div class="scrim"><div class="sheet" role="dialog" aria-label="Правка дня"><h2>День '+n+' · '+esc(fmt(k))+'</h2>'+
   '<div class="field"><label for="ed-p">Тяжек сделано</label><input id="ed-p" type="number" inputmode="numeric" min="0" value="'+pOf(k)+'"></div>'+
   '<div class="field"><label for="ed-d">'+esc(exFor(n))+', сделано</label><input id="ed-d" type="number" inputmode="numeric" min="0" value="'+dOf(k)+'"></div>'+
   '<div class="btns"><button data-act="edcancel">Отмена</button><button class="cta m" style="flex:2;min-height:52px;font-size:17px" data-act="edsave">Сохранить</button></div></div></div>';
}

function render(){
  var app=document.getElementById('app');
  app.innerHTML= tab==='today'?viewToday():tab==='history'?viewHistory():viewSettings();
  ['today','history','settings'].forEach(function(t){
    var b=document.getElementById('tab-'+t);
    if(t===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  document.getElementById('dlg').innerHTML=dialog();
}

function intIn(id){var v=parseInt(document.getElementById(id).value,10);return isFinite(v)&&v>=0?v:0;}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(!b||b.disabled)return;
  var a=b.dataset.act, n=parseInt(b.dataset.n,10)||0, key=todayKey();
  if(a!=='restart'&&armed){armed=false;}
  if(a==='tab'){tab=b.dataset.tab;note='';armed=false;render();window.scrollTo(0,0);}
  else if(a==='puff'){add(S.puffs,key,n);save();buzz();render();}
  else if(a==='done'){add(S.done,key,n);save();buzz();render();}
  else if(a==='doneall'){S.done[key]=pOf(key);save();buzz();render();}
  else if(a==='edit'){editKey=b.dataset.k;render();var el=document.getElementById('ed-p');if(el)el.focus();}
  else if(a==='edcancel'){editKey=null;render();}
  else if(a==='edsave'){S.puffs[editKey]=intIn('ed-p');S.done[editKey]=intIn('ed-d');editKey=null;save();render();}
  else if(a==='restart'){
    if(!armed){armed=true;render();}
    else{armed=false;S.startDate=todayKey();S.puffs={};S.done={};save();tab='today';note='';render();}
  }
  else if(a==='copy'){
    var txt=JSON.stringify(S);
    try{navigator.clipboard.writeText(txt).then(function(){note='Копия в буфере обмена.';render();},function(){note='Не получилось скопировать. Выдели текст вручную в поле ниже.';document.getElementById('imp').value=txt;render();});}
    catch(err){note='Не получилось скопировать.';render();}
  }
  else if(a==='import'){
    try{
      var o=JSON.parse(document.getElementById('imp').value);
      if(!o||typeof o!=='object'||!o.puffs)throw new Error('bad');
      S=Object.assign(DEF(),o);fix();save();note='Загружено.';render();
    }catch(err){note='Текст не похож на резервную копию. Вставь его целиком.';render();}
  }
});

document.addEventListener('change',function(e){
  var t=e.target, f=t&&t.dataset&&t.dataset.set; if(!f)return;
  if(f==='startLimit'){S.startLimit=Math.min(1000,Math.max(1,parseInt(t.value,10)||DEF().startLimit));}
  else if(f==='step'){var v=parseInt(t.value,10);S.step=isFinite(v)?Math.min(50,Math.max(0,v)):DEF().step;}
  else if(f==='rollHour'){var r=parseInt(t.value,10);S.rollHour=isFinite(r)?Math.min(12,Math.max(0,r)):DEF().rollHour;}
  else if(f==='startDate'){if(/^\d{4}-\d{2}-\d{2}$/.test(t.value))S.startDate=t.value;}
  else if(f==='exercises'){var l=t.value.split('\n').map(function(x){return x.trim();}).filter(Boolean);if(l.length)S.exercises=l;}
  save();render();
});

document.addEventListener('visibilitychange',function(){if(!document.hidden&&!editKey&&tab!=='settings')render();});

render();
initDb();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
})();
</script>
</body>
</html>
